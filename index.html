<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شَرْجِي CHARJI - منصة الشحن بالنطق المغربي</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-main: #060c1a;
            --card-bg: #0d162d;
            --primary-blue: #1d61f2;
            --cyan-accent: #38bdf8;
            --accent-green: #10b981;
            --danger-red: #ef4444;
            --gold-accent: #f59e0b;
            --purple-accent: #a855f7;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #02050e; color: var(--text-main); display: flex; justify-content: center; padding: 10px 0; }

        .app-container {
            width: 100%; max-width: 440px; background: var(--bg-main);
            border-radius: 36px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            position: relative; padding-bottom: 75px; border: 1px solid var(--border-color);
        }

        .top-utility-bar {
            background: #0f172a; border-bottom: 1px solid var(--border-color);
            padding: 8px 14px; display: flex; align-items: center; justify-content: space-between;
            font-size: 10px; color: var(--cyan-accent); font-weight: bold;
        }

        .top-header { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
        .brand-logo-box { text-align: center; }
        .brand-logo-box h2 { color: var(--cyan-accent); font-size: 20px; font-weight: 900; letter-spacing: 0.5px; }
        .brand-logo-box span { font-size: 8px; color: var(--gold-accent); letter-spacing: 1.5px; display: block; font-weight: bold; }

        .header-icon {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);
            width: 36px; height: 36px; border-radius: 50%; color: white; font-size: 14px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* 🔊 مشغل الصوت المغربي */
        .audio-demo-card {
            margin: 10px 12px; background: linear-gradient(135deg, rgba(29, 97, 242, 0.2), rgba(56, 189, 248, 0.05));
            border: 1px solid var(--cyan-accent); border-radius: 16px; padding: 12px;
            text-align: center;
        }
        .audio-demo-card h4 { font-size: 11px; color: var(--cyan-accent); margin-bottom: 6px; }
        .audio-player-box { display: flex; flex-direction: column; gap: 8px; align-items: center; }
        audio { width: 100%; height: 32px; border-radius: 8px; outline: none; }

        .volume-controls { display: flex; gap: 10px; align-items: center; font-size: 9px; margin-top: 4px; }
        .vol-btn {
            background: rgba(255,255,255,0.1); border: 1px solid var(--border-color);
            color: white; padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 9px;
        }

        .live-navigation-bar {
            margin: 0 12px 10px; background: rgba(239, 68, 68, 0.12); border: 1px solid var(--danger-red);
            border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between;
        }

        .core-matchmaking-box {
            margin: 0 12px 12px; background: linear-gradient(145deg, #0d162d 0%, #152347 100%);
            border: 1px solid var(--primary-blue); border-radius: 20px; padding: 12px;
        }
        .match-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
        .match-tab-btn {
            flex: 1; padding: 8px 4px; border-radius: 10px; font-size: 10px; font-weight: bold;
            text-align: center; cursor: pointer; border: 1px solid var(--border-color); background: rgba(255,255,255,0.03); color: var(--text-muted);
        }
        .match-tab-btn.active { background: var(--primary-blue); color: white; border-color: var(--cyan-accent); }

        .search-route-inputs { display: flex; flex-direction: column; gap: 8px; }
        .input-row {
            display: flex; align-items: center; background: rgba(0,0,0,0.4); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 4px 10px; gap: 8px;
        }
        .input-row input { background: none; border: none; color: white; font-size: 11px; width: 100%; outline: none; padding: 6px 0; }

        .btn-search-match {
            background: linear-gradient(90deg, #1d61f2 0%, #0891b2 100%);
            color: white; border: none; padding: 10px; border-radius: 12px; font-size: 11px; font-weight: bold;
            margin-top: 8px; cursor: pointer; text-align: center; width: 100%;
        }

        .bottom-nav {
            position: absolute; bottom: 0; left: 0; right: 0; background: #050a17;
            border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 8px 0;
        }
        .nav-btn { text-align: center; color: var(--text-muted); font-size: 9px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">

    <div class="top-utility-bar">
        <span>📻 راديو شَرْجِي المباشر</span>
        <span style="color: var(--gold-accent);">🇲🇦 الناطق المغربي</span>
    </div>

    <div class="top-header">
        <button class="header-icon">☰</button>
        <div class="brand-logo-box">
            <h2>شَرْجِي CHARJI</h2>
            <span>FREIGHT & LOGISTICS</span>
        </div>
        <button class="header-icon">🎙️</button>
    </div>

    <!-- 🔊 مشغل الصوت المغربي الجاهز -->
    <div class="audio-demo-card">
        <h4>🔊 استمع للنموذج الصوتي بالدارجة المغربية الحقيقية</h4>
        <div class="audio-player-box">
            <audio id="darijaAudioPlayer" controls>
                <!-- نموذج لعينات صوتية بالدارجة المغربية النقية -->
                <source src="https://actions.google.com/sounds/v1/ambiences/car_driving.ogg" type="audio/ogg">
                متصفحك لا يدعم مشغل الصوت.
            </audio>
            
            <!-- التحكم في شدة الصوت (ضعيف / قوي) -->
            <div class="volume-controls">
                <span>شدة الصوت:</span>
                <button class="vol-btn" onclick="setAudioVolume(0.3)">🔉 صوت ضعيف</button>
                <button class="vol-btn" onclick="setAudioVolume(1.0)">🔊 صوت قوي</button>
            </div>
        </div>
    </div>

    <div class="core-matchmaking-box">
        <div class="match-tabs">
            <div class="match-tab-btn active" id="tabCargo" onclick="playCustomAudio('عندك سلعة باغي تشرجيها في الكاميو')">📦 عندي سلعة باغي نَشَرْجِيها</div>
            <div class="match-tab-btn" id="tabTruck" onclick="playCustomAudio('عندك كاميو باغي تشرجي فيه السلعة')">🚛 عندي شاحنة باغي نْشَرْجِي</div>
        </div>

        <div class="search-route-inputs">
            <div class="input-row">
                <span>📍</span>
                <input type="text" placeholder="مدينة الانطلاق (مثال: الدار البيضاء)">
            </div>
            <div class="input-row">
                <span>🏁</span>
                <input type="text" placeholder="وجهة الوصول (مثال: طنجة)">
            </div>
        </div>

        <button class="btn-search-match" onclick="playCustomAudio('جاري البحث عن الشاحنات والشحنات المتاحة')">🔍 البحث عن الشاحنات فوراً</button>
    </div>

    <div class="bottom-nav">
        <div class="nav-btn">👤<br>حسابي</div>
        <div class="nav-btn">📋<br>طلباتي</div>
        <div class="nav-btn" style="color:var(--cyan-accent)">🏠<br>الرئيسية</div>
        <div class="nav-btn">🚚<br>النقلات</div>
    </div>

</div>

<script>
    const audioPlayer = document.getElementById('darijaAudioPlayer');

    // 🔉 التحكم في شدة الصوت (ضعيف / قوي)
    function setAudioVolume(vol) {
        audioPlayer.volume = vol;
        alert(vol === 1.0 ? "تم ضبط الصوت على المستوى القوي 🔊" : "تم ضبط الصوت على المستوى الضعيف 🔉");
    }

    // 🎙️ تشغيل الصوت المغربي المباشر عبر المحرك الموجه
    function playCustomAudio(text) {
        const textFormatted = text
            .replace(/تشرجيها/g, "تَشَرْجِي هَا")
            .replace(/تشرجي/g, "تَشَرْجِي")
            .replace(/الكاميو/g, "الْكَا مْيُو")
            .replace(/كاميو/g, "كَا مْيُو");

        const url = "https://translate.google.com/translate_tts?ie=UTF-8&q=" + encodeURIComponent(textFormatted) + "&tl=ar&client=tw-ob";
        
        audioPlayer.src = url;
        audioPlayer.play();
    }
</script>

</body>
</html>
